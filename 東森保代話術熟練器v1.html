<script>
// 解析純文字資料為 JSON 陣列
function parseData() {
    // 修正：針對不同作業系統與瀏覽器環境，先將所有換行統一標準化為 \n，避免正則表達式在安卓 LINE WebView 失效
    let rawText = document.getElementById('raw-data').textContent || '';
    rawText = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
    
    const result = [];
    const blocks = rawText.split(/(?=\n\[)/);

    blocks.forEach(block => {
        const lines = block.trim().split('\n');
        if (lines.length >= 2 && lines[0].startsWith('[')) {
            const category = lines[0].slice(1, -1);
            const idMatch = lines[1].match(/^([A-Z0-9]+)\.\s*/);
            
            if (idMatch) {
                const id = idMatch[1];
                let textContent = lines.slice(1).join('\n').substring(idMatch[0].length);
                result.push({
                    id: id,
                    category: category,
                    text: textContent,
                    type: id.startsWith('NG') ? 'NG→正確替代' : '優良話術'
                });
            }
        }
    });
    return result;
}

const DATA = parseData();

// 修正：為避免在安卓 LINE 內建瀏覽器（無語音 API）直接崩潰，加入防護機制
const synth = window.speechSynthesis || null; 

// 修正：安全呼叫語音中斷，避免 undefined 錯誤
const cancelSynth = () => { if(synth) try{ synth.cancel(); }catch(e){} };

const $ = id => document.getElementById(id);
const voiceSel=$('voice'), rateSel=$('rate'), category=$('category'), list=$('list');
const bar=$('bar'), count=$('count'), backtop=$('backtop'), pauseBtn=$('pause');

let filtered=[...DATA], index=0, playing=false, paused=false, session=0, spoken=0;
let rate=1.15, selectedVoice=null, userPicked=false, voices=[], voiceSig='';
let cards=[], lastActive=-1;
rateSel.value='1.15';

const alive = sid => playing && sid===session;

/* ---------- 語音清單：預設 Yating ---------- */
const isZh = v => /^zh(-|_|$)/i.test(v.lang) || /中文|Chinese|Taiwan|台灣|國語|Mandarin/i.test(v.name);
function voiceScore(v){                     
  const yating=/yating/i.test(v.name), tw=/zh[-_]TW/i.test(v.lang);
  if(yating) return v.localService?0:1;
  if(tw) return v.localService?2:3;
  return 4;
}
function pickDefault(pool){
  return [...pool].sort((a,b)=>voiceScore(a)-voiceScore(b))[0] || null;
}
function loadVoices(){
  if(!synth) return; // 防護機制
  const all=synth.getVoices();
  if(!all.length) return;
  const zh=all.filter(isZh);
  const pool=zh.length?zh:all;
  const sig=pool.map(v=>v.voiceURI||v.name).join('|');
  if(sig===voiceSig) return;                
  voiceSig=sig; voices=pool;
  const keep=userPicked&&selectedVoice?(selectedVoice.voiceURI||selectedVoice.name):null;
  voiceSel.innerHTML='<option value="">系統預設</option>';
  pool.forEach(v=>{
    const o=document.createElement('option');
    o.value=v.voiceURI||v.name; o.textContent=v.name+'（'+v.lang+'）';
    voiceSel.appendChild(o);
  });
  const chosen=(keep&&pool.find(v=>(v.voiceURI||v.name)===keep)) || pickDefault(pool);
  selectedVoice=chosen;
  voiceSel.value=chosen?(chosen.voiceURI||chosen.name):'';
}
if(synth && 'onvoiceschanged' in synth) synth.onvoiceschanged=loadVoices;
loadVoices();
{ let n=0; const t=setInterval(()=>{ loadVoices(); if(++n>=20) clearInterval(t); },300); }

/* ---------- 畫面 ---------- */
[...new Set(DATA.map(x=>x.category))].forEach(c=>{
  const o=document.createElement('option'); o.value=c; o.textContent=c; category.appendChild(o);
});
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
  list.innerHTML=''; lastActive=-1;
  filtered.forEach((x,i)=>{
    const d=document.createElement('div');
    d.className='card'; d.id='card-'+i;
    d.innerHTML=`<div class="cat">${x.category} <span class="num">${x.id}</span></div>
      <div class="phrase">${escapeHtml(x.text)}</div>
      <div class="hint">點選此句即可從這一句開始播放</div>`;
    d.onclick=()=>{ index=i; startAutoPlay(); };
    list.appendChild(d);
  });
  cards=[...list.children];
  update();
}
function update(){
  const act=(playing&&index<filtered.length)?index:-1;
  if(act!==lastActive){
    cards[lastActive]?.classList.remove('active');
    cards[act]?.classList.add('active');
    lastActive=act;
  }
  if($('total'))$('total').textContent=filtered.length;
  if(count) count.textContent=Math.min(spoken,filtered.length);
  if(bar) bar.style.width=filtered.length?Math.min(100,(index+1)/filtered.length*100)+'%':'0%';
  pauseBtn.textContent=paused?'▶ 繼續':'⏸ 暫停';
}

/* ---------- 朗讀（防卡死設計） ---------- */
let holdRef=null;                           
function speak(text,sid){
  return new Promise(resolve=>{
    if(!synth) return resolve('done'); // 若無語音 API，直接略過

    let settled=false, attemptId=0, retries=0, startT=null, guardT=null;
    const clearT=()=>{clearTimeout(startT);clearTimeout(guardT);};
    const finish=r=>{ if(settled)return; settled=true; clearT(); resolve(r); };
    const retryOrSkip=()=>{
      clearT();
      if(retries<2){ retries++; cancelSynth(); setTimeout(attempt,250); }
      else { cancelSynth(); finish('done'); }
    };
    function attempt(){
      if(settled) return;
      if(!alive(sid)) return finish('aborted');
      if(paused) return finish('paused');
      const id=++attemptId;
      const go=()=>{
        if(settled||id!==attemptId) return;
        if(!alive(sid)) return finish('aborted');
        if(paused) return finish('paused');
        const u=new SpeechSynthesisUtterance(text); holdRef=u;
        u.lang=selectedVoice?selectedVoice.lang:'zh-TW';
        if(selectedVoice) u.voice=selectedVoice;
        u.rate=rate; u.pitch=1; u.volume=1;
        u.onstart=()=>{
          if(settled||id!==attemptId) return;
          clearTimeout(startT);
          const est=Math.max(6000, text.length*450/rate+3000);
          guardT=setTimeout(()=>{ if(!settled&&id===attemptId){ cancelSynth(); finish(paused?'paused':'done'); } }, est);
        };
        u.onend=()=>{ if(settled||id!==attemptId) return; finish(!alive(sid)?'aborted':paused?'paused':'done'); };
        u.onerror=()=>{
          if(settled||id!==attemptId) return;
          if(!alive(sid)) return finish('aborted');
          if(paused) return finish('paused');
          retryOrSkip();
        };
        startT=setTimeout(()=>{
          if(settled||id!==attemptId) return;
          if(synth.speaking&&!synth.pending) return;   
          retryOrSkip();
        },4000);
        try{ synth.speak(u); }catch(e){ retryOrSkip(); }
      };
      if(synth.speaking||synth.pending){ cancelSynth(); setTimeout(go,120); }
      else go();
    }
    attempt();
  });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function holdWhilePaused(sid){ while(alive(sid)&&paused) await sleep(150); }

async function run(sid){
  while(alive(sid)&&index<filtered.length){
    await holdWhilePaused(sid);
    if(!alive(sid)) return;
    update();
    cards[index]?.scrollIntoView({behavior:'smooth',block:'center'});
    const r=await speak(filtered[index].text,sid);
    if(!alive(sid)) return;
    if(r==='paused') continue;              
    await sleep(850);
    if(!alive(sid)) return;
    if(paused){ await holdWhilePaused(sid); if(!alive(sid)) return; }
    spoken++; index++; update();
  }
  if(sid===session&&index>=filtered.length){ playing=false; paused=false; index=0; update(); }
}
function startAutoPlay(){
  // 修正：針對無語音功能的內建瀏覽器，給予友善提示，引導使用者去外部開啟
  if(!synth){ 
     alert('您目前使用的瀏覽器（如LINE內建瀏覽器）不支援語音朗讀功能。\n\n💡 請點擊畫面右上角的「⋮」或「分享」按鈕，選擇「以預設瀏覽器開啟」（如 Chrome），即可正常使用語音。'); 
     return; 
  }
  session++; playing=true; paused=false;
  try{ if(synth) { synth.cancel(); synth.resume(); } }catch(e){}   
  if(index>=filtered.length) index=0;
  update();
  run(session);
}
function togglePause(){
  if(!playing) return;
  paused=!paused;
  if(paused){ cancelSynth(); }
  update();
}
function stop(){
  session++; playing=false; paused=false;
  cancelSynth();
  index=0; spoken=0; update();
}

/* ---------- 事件 ---------- */
$('play').onclick=startAutoPlay;
pauseBtn.onclick=togglePause;
$('stop').onclick=stop;
rateSel.onchange=()=>{ rate=parseFloat(rateSel.value)||1.15; };
voiceSel.onchange=()=>{
  userPicked=true;
  selectedVoice=voices.find(v=>(v.voiceURI||v.name)===voiceSel.value)||null;
};
category.onchange=()=>{
  stop(); filtered=category.value==='全部'?[...DATA]:DATA.filter(x=>x.category===category.value); render();
};
window.addEventListener('scroll',()=>backtop.classList.toggle('show',scrollY>300),{passive:true});
backtop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('beforeunload',()=>{ cancelSynth(); });
window.addEventListener('pagehide',()=>{ cancelSynth(); });
render();
</script>
